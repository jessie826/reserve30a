name: Repair Pages HTTPS
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Request certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "BEFORE"
          gh api repos/${{ github.repository }}/pages
          echo "PUT"
          gh api -X PUT repos/${{ github.repository }}/pages --input - <<EOF
          {"cname":"reserve30a.net","https_enforced":true}
          EOF
          echo "HEALTH"
          gh api repos/${{ github.repository }}/pages/health
          echo "BUILD"
          gh api -X POST repos/${{ github.repository }}/pages/builds
          echo "AFTER"
          gh api repos/${{ github.repository }}/pages
